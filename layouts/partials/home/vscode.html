<section class="overflow-hidden py-5">
  <div class="container">
    <div class="grix xs1 lg2 gutter-lg7 py-5">
      <div class="d-flex fx-center vcenter my-2 pos-row-xs2 pos-row-lg1">
        <img
          src="{{ .Site.BaseURL }}/img/snippets.gif"
          data-ax="lightbox"
          data-lightbox-caption="{{ T "home.vscode.caption" }}"
          id="lightbox"
          class="lightbox responsive-media d-flex mx-auto rounded-2 light-shadow-2"
          alt="vscode-icon"
        />
      </div>

      <div class="vscode-text">
        <h2 class="text-center mx-2 my-5 d-flex vcenter">
          <span class="iconify-inline mr-2 font-s12 icon-gradient" data-icon="mdi:microsoft-visual-studio-code"></span>
          <span class="ml-2">{{ T "home.vscode.title" }}</span>
        </h2>

        <p class="mb-4 font-s3 lh-4">
          {{ T "home.vscode.body_html" | safeHTML }}

          <a
            class="btn d-flex vcenter orange-gradient font-w600 text-white rounded-4 light-hoverable-1 my-5"
            rel="noopener"
            target="_blank"
            href="https://marketplace.visualstudio.com/items?itemName=axentix.axentix-snippet"
          >
            <span class="iconify-inline font-s4 mr-2 hide-md-down" data-icon="mdi:chevron-left-circle"></span> {{ T "home.vscode.try" }}
          </a>
        </p>
      </div>
    </div>
  </div>
</section>
