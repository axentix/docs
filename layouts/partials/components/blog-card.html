<div class="blog-card d-flex fx-col bd-3 bd-solid bd-dark-3">
  {{ $image:= .Params.image }}

  <a href="{{ .RelPermalink }}" aria-label="{{ .Title }} article image">
    <img class="blog-card-image" src="{{ .Site.BaseURL }}{{ $image }}" loading="lazy"
      alt="{{ .Title }} recommended article" />
  </a>

  <div class="p-3 d-flex fx-col fx-grow">
    <h3 class="exo mt-0 mb-2 font-s3">
      <a href="{{ .RelPermalink }}">
        {{ .Title }}
      </a>
    </h3>

    <ul class="p-0">
      <li class="d-inline-block">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 20 20" class="icon">
          <path fill="currentColor"
            d="M5.673 0a.7.7 0 0 1 .7.7v1.309h7.517v-1.3a.7.7 0 0 1 1.4 0v1.3H18a2 2 0 0 1 2 1.999v13.993A2 2 0 0 1 18 20H2a2 2 0 0 1-2-1.999V4.008a2 2 0 0 1 2-1.999h2.973V.699a.7.7 0 0 1 .7-.699M1.4 7.742v10.259a.6.6 0 0 0 .6.6h16a.6.6 0 0 0 .6-.6V7.756zm5.267 6.877v1.666H5v-1.666zm4.166 0v1.666H9.167v-1.666zm4.167 0v1.666h-1.667v-1.666zm-8.333-3.977v1.666H5v-1.666zm4.166 0v1.666H9.167v-1.666zm4.167 0v1.666h-1.667v-1.666zM4.973 3.408H2a.6.6 0 0 0-.6.6v2.335l17.2.014V4.008a.6.6 0 0 0-.6-.6h-2.71v.929a.7.7 0 0 1-1.4 0v-.929H6.373v.92a.7.7 0 0 1-1.4 0z" />
        </svg>
        {{ .Params.date.Format .Site.Params.dateFormat }}
        <br>
        <span class="mt-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="icon">
            <path fill="currentColor"
              d="M4 20q-.825 0-1.412-.587T2 18V6q0-.825.588-1.412T4 4h6l2 2h8q.825 0 1.413.588T22 8v10q0 .825-.587 1.413T20 20z" />
          </svg>
        </span>
        {{ $categories:= .Params.categories }}
        {{ range $i,$p:= $categories }}
        <a href="{{ `blog/` | relLangURL }}{{ . | urlize | lower }}/">{{ . | humanize }}{{ if ne
          $i
          (sub (len $categories) 1) }}
          {{ ", " }}
          {{ end }}
        </a>
        {{ end }}
      </li>
    </ul>

    <p class="mt-0">{{ .Summary }}</p>

    <a class="btn shadow-1 rounded-2 orange-gradient mt-auto" href="{{ .RelPermalink }}">
      Read article
    </a>
  </div>
</div>
