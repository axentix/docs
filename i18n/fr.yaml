home.grix.heading: "Système de grille simple : le"
home.grix.link: "Grix"
home.grix.body_html: |
  <strong>CSS Grid</strong> est formidable et permet de créer n'importe quelle mise en page. <br />
  Nous l'avons rendu encore <strong>plus accessible</strong> pour tout le monde, avec la grille la plus <strong>facile à utiliser</strong>,
  appelée <strong>Grix</strong>. <br />
  <br />
  Ajoutez la classe <strong>grix</strong>, vous obtenez une <strong>grille</strong>. <br />
  Ajoutez le <strong>point de rupture</strong> et le <strong>nombre de colonnes</strong> souhaité, comme <strong>xs5</strong>,
  vous obtenez 5 colonnes sur les <strong>écrans xs et plus grands</strong>.

