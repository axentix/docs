home.neu.title: "Neumorphisme"
home.neu.body_html: |
  Nous avons créé <strong>le premier framework</strong> basé sur le <strong>design neumorphique</strong>. <br />
  Il s'agit d'une <strong>extension d'Axentix</strong> qui vous permet d'utiliser des
  <strong>ombres neumorphiques</strong> partout. <br />
  <br />
  Deux thèmes de base sont fournis, <strong>sombre</strong> et <strong>clair</strong>. <br />
  Vous pouvez générer n'importe quelle <strong>couleur de thème</strong> avec notre
  <a href="https://neu.useaxentix.com/docs/builder" target="_blank" rel="noopener" class="text-primary">
    <strong>builder</strong></a>. <br />
  Voici un exemple du type de design que vous pouvez créer avec <strong>Neu-Axentix</strong>. <br />
