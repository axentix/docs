home.reviews.title: "Ce qu'ils disent de nous"
home.review.1: "\"J'aime vraiment ce framework. Facile à utiliser et très flexible.\""
home.review.1.author: "- Evolve Hosting"
home.review.2: "\"Ma quête est terminée : j'ai trouvé le framework CSS optimal. Diffusons la nouvelle sur Axentix.\""
home.review.2.author: "- Lerche"
home.review.3: "\"Merci pour ce framework CSS ! Je viens de finir de porter une app depuis un concurrent et je suis vraiment impressionné ! J'espère utiliser Axentix longtemps.\""
home.review.3.author: "- Proofrock"
home.review.4: "\"Wow, 5 minutes sur la doc et je suis vraiment impressionné ! Bravo l'équipe.\""
home.review.4.author: "- Dave"
home.review.5: "\"Axentix s'est beaucoup amélioré depuis la dernière fois. Bravo l'équipe.\""
home.review.5.author: "- Edwadjei"
home.review.6: "\"Le framework est si facile à prendre en main, je débute le développement web et je me retrouve vite dans la doc. Merci pour le travail accompli !\""
home.review.6.author: "- Hikudo"

