home.neu.title: "Neumorphism"
home.neu.body_html: |
  We created <strong>the first framework</strong> based on <strong>neumorphism design</strong>. <br />
  This is an <strong>extension of Axentix</strong> which allows you to use
  <strong>neumorphic shadows</strong> anywhere. <br />
  <br />
  Two basic themes are provided, <strong>dark</strong> and <strong>light</strong>. <br />
  You can generate any <strong>theme color</strong> using our
  <a href="https://neu.useaxentix.com/docs/builder" target="_blank" rel="noopener" class="text-primary">
    <strong>builder</strong></a>. <br />
  Here is an example of what type of design you can create using <strong>Neu-Axentix</strong>. <br />
