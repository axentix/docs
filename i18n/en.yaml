home.grix.heading: "Easy grid system : The"
home.grix.link: "Grix"
home.grix.body_html: |
  <strong>CSS Grid</strong> is awesome and allows to create any wanted layout. <br />
  We made it even <strong>more accessible</strong> for anyone, creating the most <strong>easy to use</strong> grid
  called <strong>Grix</strong>. <br />
  <br />
  Add the <strong>grix</strong> class, you get a <strong>grid</strong>. <br />
  Add the <strong>breakpoint</strong> and the <strong>amount of column</strong> wanted, like <strong>xs5</strong>,
  you get 5 columns on <strong>xs and larger devices</strong>.

